[project]
name = "adaptlab"
version = "0.1.0"
description = "AdaptLab: LoRA/QLoRA adapter para classificação de intents de apoio ao cliente (Mukua Telecom, dados sintéticos)."
requires-python = ">=3.12,<3.13"
# Núcleo leve (dados, schema, pipeline): corre sem torch.
dependencies = [
  "pydantic==2.14.4",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Versões fixadas (verificadas no PyPI em 2026-11-20). Torch CPU vem do índice
# https://download.pytorch.org/whl/cpu (ver docs/learn/00-visao-geral.md).
train = [
  "torch==2.15.0",
  "transformers==5.23.0",
  "datasets==5.2.0",
  "trl==1.18.2",
  "peft==0.22.0",
  "accelerate==1.16.0",
  "pyyaml==6.0.3",
]
eval = [
  "scikit-learn==1.9.1",
  "numpy==2.5.5",
]
serve = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.4",
  "streamlit==1.67.0",
  "httpx==0.28.1",
]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.6",
]

[tool.setuptools]
packages = ["adaptlab", "adaptlab.data", "adaptlab.training", "adaptlab.evaluation", "adaptlab.serving"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "runs", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
